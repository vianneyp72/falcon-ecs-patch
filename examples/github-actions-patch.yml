# Patch a task definition family before your deploy job registers it.
# Pin the script version and verify its checksum.
name: patch-ecs-task
on:
  workflow_dispatch:
    inputs:
      family:
        description: Task definition family to patch
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      FALCON_CID: ${{ secrets.FALCON_CID }}
      VERSION: v0.1.0
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download falcon-ecs-patch
        run: |
          base=https://github.com/vianneyp72/falcon-ecs-patch/releases/download/$VERSION
          curl -fsSLO $base/falcon-ecs-patch.sh
          curl -fsSLO $base/falcon-ecs-patch.sh.sha256
          sha256sum -c falcon-ecs-patch.sh.sha256
          chmod +x falcon-ecs-patch.sh
      - name: Patch and register
        run: ./falcon-ecs-patch.sh patch --family "${{ inputs.family }}" --deploy --yes
