name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches script version
        run: |
          v=$(./falcon-ecs-patch.sh --version)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match script version v$v"; exit 1; }
      - name: Checksum
        run: sha256sum falcon-ecs-patch.sh > falcon-ecs-patch.sh.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" falcon-ecs-patch.sh falcon-ecs-patch.sh.sha256 --generate-notes
